<script>
// ── Firebase 초기화 ─────────────────────────────────────────
const firebaseConfig = {
  apiKey:            'AIzaSyDb_WSIXWewBWnBaZBxGZ1XtjM3REhYGtM',
  authDomain:        'worshipppt-f897d.firebaseapp.com',
  projectId:         'worshipppt-f897d',
  storageBucket:     'worshipppt-f897d.firebasestorage.app',
  messagingSenderId: '525813963254',
  appId:             '1:525813963254:web:bf49d1ce6335c38f004fd7'
};
let db;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
} catch(e) { console.error('Firebase 초기화 실패:', e); }

const ADMIN_PASSWORD = 'Jlozh990604$';
let allLicenses   = [];
let currentFilter = 'all';
let licenseType   = 'permanent';

// ── 로그인 / 로그아웃 ───────────────────────────────────────
function login() {
  const pw  = document.getElementById('pwInput').value.trim();
  const msg = document.getElementById('loginMsg');
  if (!db) { msg.textContent = '❌ Firebase 로딩 중입니다. 잠시 후 다시 시도해주세요.'; msg.className = 'msg error'; return; }
  if (pw === ADMIN_PASSWORD) {
    msg.textContent = '';
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainScreen').style.display  = 'block';
    document.getElementById('logoutBtn').style.display   = 'block';
    loadLicenses();
  } else {
    msg.textContent = '❌ 비밀번호가 틀렸습니다.';
    msg.className = 'msg error';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
  }
}
function logout() {
  if (!confirm('로그아웃하시겠습니까?')) return;
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('mainScreen').style.display  = 'none';
  document.getElementById('logoutBtn').style.display   = 'none';
  document.getElementById('pwInput').value = '';
  document.getElementById('loginMsg').textContent = '';
  allLicenses = [];
}

// ── 탭 전환 ────────────────────────────────────────────────
function switchTab(n) {
  document.getElementById('panel1').style.display = n === 1 ? 'block' : 'none';
  document.getElementById('panel2').style.display = n === 2 ? 'block' : 'none';
  document.getElementById('tab1').className = 'tab-btn' + (n === 1 ? ' active' : '');
  document.getElementById('tab2').className = 'tab-btn' + (n === 2 ? ' active' : '');
}

// ── 필터 ───────────────────────────────────────────────────
function setFilter(f) {
  currentFilter = f;
  const map = {
    all:     { id:'filterAll',     cls:'on' },
    active:  { id:'filterActive',  cls:'on' },
    inactive:{ id:'filterInact',   cls:'on' },
    perm:    { id:'filterPerm',    cls:'on' },
    trial:   { id:'filterTrial',   cls:'on-orange' },
    expired: { id:'filterExpired', cls:'on-red' }
  };
  ['filterAll','filterActive','filterInact','filterPerm','filterTrial','filterExpired']
    .forEach(id => document.getElementById(id).className = 'filter-btn');
  const t = map[f];
  if (t) document.getElementById(t.id).className = 'filter-btn ' + t.cls;
  renderList();
}

// ── 라이선스 종류 토글 ─────────────────────────────────────
function setLicType(type) {
  licenseType = type;
  document.getElementById('btnPerm').className  = 'type-btn' + (type === 'permanent' ? ' active-perm'  : '');
  document.getElementById('btnTrial').className = 'type-btn' + (type === 'trial'     ? ' active-trial' : '');
  const preview = document.getElementById('expiresPreview');
  const dateEl  = document.getElementById('expiresDate');
  if (type === 'trial') {
    const exp = new Date();
    exp.setDate(exp.getDate() + 10);
    dateEl.textContent = exp.toLocaleDateString('ko-KR', {year:'numeric', month:'long', day:'numeric'});
    preview.classList.add('show');
  } else {
    preview.classList.remove('show');
  }
}

// ── 전화번호 자동 포맷 ─────────────────────────────────────
function formatPhone(el) {
  let v = el.value.replace(/\D/g, '');
  if      (v.length <= 3) el.value = v;
  else if (v.length <= 7) el.value = v.slice(0,3) + '-' + v.slice(3);
  else                    el.value = v.slice(0,3) + '-' + v.slice(3,7) + '-' + v.slice(7,11);
}

// ── 헬퍼 ───────────────────────────────────────────────────
function isExpired(d)    { return d.expiresAt && new Date(d.expiresAt) < new Date(); }
function isSoonExpire(d) {
  if (!d.expiresAt) return false;
  const diff = new Date(d.expiresAt) - new Date();
  return diff > 0 && diff < 2 * 24 * 60 * 60 * 1000;
}
function licTypeOf(d) {
  return d.licenseType || (d.expiresAt ? 'trial' : 'permanent');
}

// ── 랜덤 키 생성 ───────────────────────────────────────────
function makeRandomKey() {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  const seg = () => Array.from({length:4}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
  return `${seg()}-${seg()}-${seg()}-${seg()}`;
}

// ── 라이선스 목록 불러오기 ──────────────────────────────────
async function loadLicenses() {
  document.getElementById('listMsg').textContent = '🔄 불러오는 중...';
  document.getElementById('licenseList').innerHTML = '';
  try {
    const snap = await db.collection('licenses').orderBy('createdAt','desc').get()
      .catch(() => db.collection('licenses').get());
    allLicenses = [];
    snap.forEach(doc => allLicenses.push({ id: doc.id, ...doc.data() }));
    updateStats();
    renderList();
  } catch(e) {
    document.getElementById('listMsg').textContent = '❌ 불러오기 실패: ' + e.message;
  }
}

// ── 통계 업데이트 ──────────────────────────────────────────
function updateStats() {
  const total   = allLicenses.length;
  const active  = allLicenses.filter(d => d.activated === true || d.activated === 'true').length;
  const perm    = allLicenses.filter(d => licTypeOf(d) === 'permanent').length;
  const trial   = allLicenses.filter(d => licTypeOf(d) === 'trial').length;
  const expired = allLicenses.filter(d => isExpired(d)).length;
  document.getElementById('statTotal').textContent    = total;
  document.getElementById('statActive').textContent   = active;
  document.getElementById('statInactive').textContent = total - active;
  document.getElementById('statPerm').textContent     = perm;
  document.getElementById('statTrial').textContent    = trial;
  document.getElementById('statExpired').textContent  = expired;
}

// ── 목록 렌더링 ────────────────────────────────────────────
function renderList() {
  const q   = (document.getElementById('searchInput').value || '').toLowerCase();
  let list  = [...allLicenses];
  if (currentFilter === 'active')   list = list.filter(d => (d.activated === true || d.activated === 'true'));
  if (currentFilter === 'inactive') list = list.filter(d => !(d.activated === true || d.activated === 'true'));
  if (currentFilter === 'perm')     list = list.filter(d => licTypeOf(d) === 'permanent');
  if (currentFilter === 'trial')    list = list.filter(d => licTypeOf(d) === 'trial');
  if (currentFilter === 'expired')  list = list.filter(d => isExpired(d));
  if (q) list = list.filter(d =>
    d.id.toLowerCase().includes(q) ||
    (d.email||'').toLowerCase().includes(q) ||
    (d.buyerName||'').toLowerCase().includes(q) ||
    (d.buyerPhone||'').replace(/-/g,'').includes(q.replace(/-/g,''))
  );

  const msg       = document.getElementById('listMsg');
  const container = document.getElementById('licenseList');
  msg.textContent = `${list.length}개 표시 / 전체 ${allLicenses.length}개`;
  container.innerHTML = '';

  if (list.length === 0) {
    container.innerHTML = '<div class="loading">결과가 없습니다.</div>';
    return;
  }

  list.forEach(d => {
    const key          = d.id;
    const isActive     = d.activated === true || d.activated === 'true';
    const type         = licTypeOf(d);
    const expired      = isExpired(d);
    const soon         = isSoonExpire(d);
    const activatedAt  = d.activatedAt ? d.activatedAt.substring(0,19).replace('T',' ') : '-';
    const machineShort = d.machineId   ? d.machineId.substring(0,16) + '…' : '-';

    let cardClass = 'lic-card';
    if (expired)       cardClass += ' expired-card';
    else if (isActive) cardClass += ' active-card';
    cardClass += type === 'trial' ? ' trial-card' : '';

    let typeBadge = '';
    if (expired)             typeBadge = '<span class="badge badge-expired">❌ 만료됨</span>';
    else if (type === 'trial') typeBadge = '<span class="badge badge-trial">⏳ 기한부</span>';
    else                     typeBadge = '<span class="badge badge-perm">♾️ 영구</span>';

    const actBadge = isActive
      ? '<span class="badge badge-active">✅ 활성</span>'
      : '<span class="badge badge-inactive">⬜ 미사용</span>';

    let expireRow = '';
    if (d.expiresAt) {
      const expDate = new Date(d.expiresAt);
      const expStr  = expDate.toLocaleDateString('ko-KR', {year:'numeric',month:'2-digit',day:'2-digit'});
      if (expired)     expireRow = `<div class="lic-info">📅 만료일 <span class="expired-text">${expStr} (만료됨)</span></div>`;
      else if (soon)   expireRow = `<div class="lic-info">📅 만료일 <span class="soon-text">${expStr} (곧 만료)</span></div>`;
      else             expireRow = `<div class="lic-info">📅 만료일 <span>${expStr}</span></div>`;
    }

    const phoneRow = d.buyerPhone
      ? `<div class="lic-info">📞 <span>${d.buyerPhone}</span></div>` : '';

    const card = document.createElement('div');
    card.className = cardClass;
    card.dataset.key = key;
    card.innerHTML = `
      <div class="lic-card-header">
        <div class="lic-key" onclick="copyText('${key}')" title="탭하여 복사">${key}</div>
        <div class="badge-row">${typeBadge}${actBadge}</div>
      </div>
      <div class="lic-info">👤 <span>${d.buyerName || '-'}</span></div>
      <div class="lic-info">📧 <span>${d.email || '-'}</span></div>
      ${phoneRow}
      ${expireRow}
      ${isActive ? `
        <div class="lic-info">🕐 <span>${activatedAt}</span></div>
        <div class="lic-info">💻 <span title="${d.machineId||''}">${machineShort}</span></div>
      ` : ''}
      <hr class="divider">
      <div class="lic-buyer">
        <div class="lic-buyer-row">
          <span class="lic-buyer-label">👤 이름</span>
          <input type="text" value="${(d.buyerName||'').replace(/"/g,'&quot;')}" placeholder="구매자명" maxlength="30">
        </div>
        <div class="lic-buyer-row">
          <span class="lic-buyer-label">📞 전화</span>
          <input type="tel" value="${(d.buyerPhone||'').replace(/"/g,'&quot;')}" placeholder="010-xxxx-xxxx" maxlength="13" oninput="formatPhone(this)">
        </div>
      </div>
      <div class="lic-actions">
        ${d.email ? `<button class="btn-sm btn-sm-blue" data-action="mail">📧 메일</button>` : ''}
        ${isActive ? `<button class="btn-sm btn-sm-orange" data-action="reset">🔓 인증해제</button>` : ''}
        <button class="btn-sm btn-sm-green" data-action="save">💾 저장</button>
        <button class="btn-sm btn-sm-red"  data-action="delete">🗑️ 삭제</button>
        <button class="btn-sm btn-sm-gray" data-action="copy">📋 키복사</button>
      </div>
      <div class="mail-result" id="mailResult_${key.replace(/-/g,'')}"></div>`;

    card.addEventListener('click', e => {
      const action = e.target.dataset.action;
      if (!action) return;
      if (action === 'mail')   resendMail(key, d.email, d);
      if (action === 'reset')  resetLic(key);
      if (action === 'delete') deleteLic(key);
      if (action === 'copy')   copyText(key);
      if (action === 'save') {
        const inputs   = card.querySelectorAll('.lic-buyer input');
        const newName  = inputs[0].value.trim();
        const newPhone = inputs[1].value.trim();
        saveBuyerInfo(key, newName, newPhone);
      }
    });
    container.appendChild(card);
  });
}

// ── 구매자 정보 저장 ───────────────────────────────────────
async function saveBuyerInfo(key, name, phone) {
  try {
    await db.collection('licenses').doc(key).update({ buyerName: name, buyerPhone: phone });
    const idx = allLicenses.findIndex(d => d.id === key);
    if (idx >= 0) { allLicenses[idx].buyerName = name; allLicenses[idx].buyerPhone = phone; }
    alert('✅ 저장되었습니다.');
    renderList();
  } catch(e) { alert('저장 실패: ' + e.message); }
}

// ── 메일 재발송 (EmailJS) ──────────────────────────────────
async function resendMail(key, email, d) {
  if (!confirm(`${email} 으로 라이선스 키를 발송할까요?\n\n키: ${key}`)) return;
  const resultEl = document.getElementById('mailResult_' + key.replace(/-/g,''));
  if (resultEl) { resultEl.textContent = '📧 발송 중...'; resultEl.style.display = 'block'; resultEl.style.color = '#1565C0'; }
  try {
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      to_email:     email,
      buyer_name:   d.buyerName || email,
      license_key:  key,
      license_type: licTypeOf(d) === 'permanent' ? '영구' : '기한부',
      expires_at:   d.expiresAt ? new Date(d.expiresAt).toLocaleDateString('ko-KR') : '무제한',
      guide_url:    WORSHIP_GUIDE_URL
    });
    if (resultEl) { resultEl.textContent = `✅ ${email} 발송 완료`; resultEl.style.color = '#2C5F2D'; }
  } catch(err) {
    const errMsg = err?.text || err?.message || JSON.stringify(err);
    if (resultEl) { resultEl.textContent = `❌ 발송 실패: ${errMsg}`; resultEl.style.color = '#B71C1C'; }
  }
}

// ── 인증 해제 ───────────────────────────────────────────────
async function resetLic(key) {
  if (!confirm(`인증을 해제하시겠습니까?\n\n${key}\n\n해제 후 다른 PC에서 재인증 가능합니다.`)) return;
  try {
    await db.collection('licenses').doc(key).update({ activated:false, machineId:'', activatedAt:'' });
    const idx = allLicenses.findIndex(d => d.id === key);
    if (idx >= 0) { allLicenses[idx].activated = false; allLicenses[idx].machineId = ''; allLicenses[idx].activatedAt = ''; }
    updateStats(); renderList();
    alert('✅ 인증이 해제되었습니다.');
  } catch(e) { alert('실패: ' + e.message); }
}

// ── 삭제 ────────────────────────────────────────────────────
async function deleteLic(key) {
  if (!confirm(`삭제하시겠습니까?\n\n${key}\n\n삭제 후 복구할 수 없습니다.`)) return;
  try {
    await db.collection('licenses').doc(key).delete();
    allLicenses = allLicenses.filter(d => d.id !== key);
    updateStats(); renderList();
    alert('✅ 삭제되었습니다.');
  } catch(e) { alert('실패: ' + e.message); }
}

// ── 키 발급 ─────────────────────────────────────────────────
async function issueKey() {
  const name  = document.getElementById('newName').value.trim();
  const email = document.getElementById('newEmail').value.trim();
  const phone = document.getElementById('newPhone').value.trim();
  const msg   = document.getElementById('issueMsg');
  const mailResultEl = document.getElementById('issueMailResult');

  if (!email || !/^[^@]+@[^@]+\.[^@]+$/.test(email)) {
    msg.textContent = '❌ 올바른 이메일을 입력해주세요.';
    msg.className = 'msg error'; return;
  }
  msg.textContent = '⏳ 발급 중...'; msg.className = 'msg info';
  mailResultEl.style.display = 'none';

  const key       = makeRandomKey();
  const expiresAt = licenseType === 'trial'
    ? (() => { const d = new Date(); d.setDate(d.getDate() + 10); return d.toISOString(); })()
    : null;

  const docData = {
    activated: false, machineId: '', activatedAt: '',
    email, buyerName: name, buyerPhone: phone,
    licenseType, createdAt: new Date().toISOString(),
    ...(expiresAt ? { expiresAt } : {})
  };

  try {
    await db.collection('licenses').doc(key).set(docData);

    document.getElementById('newKeyText').textContent = key;
    document.getElementById('newKeyResult').style.display = 'block';
    document.getElementById('newName').value  = '';
    document.getElementById('newEmail').value = '';
    document.getElementById('newPhone').value = '';

    const expStr = expiresAt
      ? `만료일: ${new Date(expiresAt).toLocaleDateString('ko-KR')}`
      : '영구 라이선스';
    msg.textContent = `✅ 발급 완료! (${expStr})`;
    msg.className = 'msg ok';

    allLicenses.unshift({ id: key, ...docData });
    updateStats();

    // EmailJS 메일 발송
    if (email) {
      mailResultEl.textContent = '📧 메일 발송 중...';
      mailResultEl.style.display = 'block';
      mailResultEl.style.color = '#1565C0';
      try {
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          to_email:     email,
          buyer_name:   name || email,
          license_key:  key,
          license_type: licenseType === 'permanent' ? '영구' : '기한부',
          expires_at:   expiresAt ? new Date(expiresAt).toLocaleDateString('ko-KR') : '무제한',
          guide_url:    WORSHIP_GUIDE_URL
        });
        mailResultEl.textContent = `✅ ${email} 으로 메일 발송 완료`;
        mailResultEl.style.color = '#2C5F2D';
      } catch(err) {
        const errMsg = err?.text || err?.message || JSON.stringify(err);
        mailResultEl.textContent = `⚠️ 키 발급 완료. 메일 발송 실패: ${errMsg}`;
        mailResultEl.style.color = '#E65100';
      }
    }

  } catch(e) {
    msg.textContent = '❌ 발급 실패: ' + e.message;
    msg.className = 'msg error';
  }
}

// ── 복사 ────────────────────────────────────────────────────
function copyText(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => alert('📋 복사됨: ' + text));
  } else {
    const el = document.createElement('textarea');
    el.value = text; document.body.appendChild(el);
    el.select(); document.execCommand('copy');
    el.remove(); alert('📋 복사됨: ' + text);
  }
}
function copyKey() {
  copyText(document.getElementById('newKeyText').textContent);
}
